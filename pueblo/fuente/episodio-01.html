<title>El pueblo que no duerme, episodio 01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}</style>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
/* 9:16 renderer for "El pueblo que no duerme", episode 1.
   window.TL is injected by the export script. Images come from ../assets. render(t, subs) draws one frame. */
const W = 1080, H = 1920;
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(42);
const IMG = {};
const loadImg = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; });
window.ready = Promise.all([['daniel', 'daniel.jpg'], ['abuela', 'abuela.jpg'], ['figura', 'figura.jpg'], ['camioneta', 'camioneta.jpg']].map(([k, f]) => loadImg(k, '../assets/' + f)))
  .then(() => document.fonts.load('800 80px Cinzel')).then(() => document.fonts.ready);

/* ---------- textures ---------- */
function blobTex(n, col, amin, amax, rmin, rmax, seed) {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const x = c.getContext('2d'); const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const px = r() * 1024, py = r() * 1024, rad = rmin + r() * (rmax - rmin), a = amin + r() * (amax - amin);
    for (const ox of [-1024, 0, 1024]) for (const oy of [-1024, 0, 1024]) {
      const gr = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, rad);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); x.fillStyle = gr; x.fillRect(px + ox - rad, py + oy - rad, rad * 2, rad * 2);
    }
  }
  return c;
}
const FOG = blobTex(260, '205,218,235', .03, .09, 60, 260, 7);
const CLOUD = blobTex(200, '60,70,95', .08, .22, 80, 300, 11);
const FB = document.createElement('canvas'); FB.width = W; FB.height = H; const fb = FB.getContext('2d');
function fogLayer(t, speed, alpha, scale = 1.6, y0 = 0, h = H, tex = FOG) {
  // tiled drifting texture, faded in/out vertically (no hard edges)
  fb.globalCompositeOperation = 'source-over'; fb.clearRect(0, 0, W, H);
  const s = 1024 * scale, ox = ((t * speed) % s + s) % s;
  for (let x = -ox - s; x < W + s; x += s) for (let y = -s + (t * speed * .15 % s); y < H + s; y += s) fb.drawImage(tex, x, y, s, s);
  if (y0 > 0 || h < H) {
    const m = fb.createLinearGradient(0, y0, 0, y0 + h); m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(.35, 'rgba(0,0,0,1)'); m.addColorStop(.75, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
    fb.globalCompositeOperation = 'destination-in'; fb.fillStyle = m; fb.fillRect(0, 0, W, H);
  }
  g.save(); g.globalAlpha = alpha; g.drawImage(FB, 0, 0); g.restore();
}
const GRAIN = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } x.putImageData(d, 0, 0); return c; })();

/* ---------- helpers ---------- */
function photo(img, cx, cy, scale) { // image point (cx,cy) to canvas center
  g.drawImage(img, W / 2 - cx * scale, H / 2 - cy * scale, img.width * scale, img.height * scale);
}
function tint(col, a, mode = 'multiply') { g.save(); g.globalCompositeOperation = mode; g.globalAlpha = a; g.fillStyle = col; g.fillRect(0, 0, W, H); g.restore(); }
function radial(x, y, r, col, mode = 'screen', a = 1) { g.save(); g.globalCompositeOperation = mode; g.globalAlpha = a; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore(); }
function vignette(a = .75, inner = .25) { const gr = g.createRadialGradient(W / 2, H * .45, H * inner, W / 2, H * .45, H * .78); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const flick = (t, k = 1) => .78 + .12 * Math.sin(t * 13 * k) + .07 * Math.sin(t * 31 * k + 1) + .05 * Math.sin(t * 7.3 * k);
function shake(t, t0, amp) { const k = t - t0; if (k < 0 || k > .5) return [0, 0]; const e = (1 - k / .5) * amp; return [Math.sin(k * 90) * e, Math.cos(k * 77) * e]; }

/* ---------- procedural sets ---------- */
const HOUSES = Array.from({ length: 70 }, () => { const a = R() * 6.28, d = Math.sqrt(R()); return { x: Math.cos(a) * d * 330, y: Math.sin(a) * d * 120, w: 26 + R() * 30, h: 16 + R() * 14, lit: R() < .18, rf: R() }; }).sort((a, b) => a.y - b.y);
function ridge(seed, base, amp, col, x0 = 0) { g.fillStyle = col; g.beginPath(); g.moveTo(-600, H + 600); for (let x = -600; x <= W + 600; x += 10) { const xx = x + x0; g.lineTo(x, base - amp * (.55 * Math.sin(xx * .0042 + seed) + .3 * Math.sin(xx * .011 + seed * 2.1) + .15 * Math.sin(xx * .029 + seed * 3.3))); } g.lineTo(W + 600, H + 600); g.fill(); }

function sceneAerial(t, k) { // k: 0..1 progress of clip
  const e = ease(k);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#05070f'); sky.addColorStop(.6, '#101a2e'); sky.addColorStop(1, '#1b2740'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // moon
  const my = lerp(330, 260, e); radial(760, my, 420, 'rgba(170,190,230,.35)'); g.fillStyle = '#dfe6f2'; g.beginPath(); g.arc(760, my, 78, 0, 7); g.fill();
  g.fillStyle = 'rgba(150,160,180,.25)'; for (const [dx, dy, r] of [[-20, -15, 18], [25, 20, 12], [5, 30, 9]]) { g.beginPath(); g.arc(760 + dx, my + dy, r, 0, 7); g.fill(); }
  // clouds drifting
  fogLayer(t, 14, .85, 1.3, -200, 1200, CLOUD);
  // camera descends: mountains rise, village grows
  const zoom = lerp(.6, 1.9, e), lift = lerp(0, 700, e);
  ridge(1, 980 + lift * .35, 260, '#1a2236', t * 3); ridge(4, 1150 + lift * .55, 230, '#131a2a', t * 5);
  // village valley
  g.save(); g.translate(W / 2, 1380 + lift * .2); g.scale(zoom, zoom);
  g.fillStyle = '#0d1320'; g.beginPath(); g.ellipse(0, 20, 520, 190, 0, 0, 7); g.fill();
  for (const h of HOUSES) {
    const x = h.x, y = h.y;
    g.fillStyle = '#2a2a33'; g.fillRect(x - h.w / 2, y - h.h, h.w, h.h);
    g.fillStyle = '#1b1b22'; g.beginPath(); g.moveTo(x - h.w / 2 - 3, y - h.h); g.lineTo(x + (h.rf - .5) * 10, y - h.h - 10); g.lineTo(x + h.w / 2 + 3, y - h.h); g.fill();
    if (h.lit) { const f = .75 + .25 * Math.sin(t * 2 + x); g.fillStyle = `rgba(255,190,90,${f})`; g.fillRect(x - 4, y - h.h * .65, 7, 7); }
  }
  for (const h of HOUSES) if (h.lit) radial(h.x, h.y - h.h * .6, 26, 'rgba(255,170,70,.35)', 'screen');
  // church / clock tower
  g.fillStyle = '#26262e'; g.fillRect(-14, -150, 28, 120); g.beginPath(); g.moveTo(-18, -150); g.lineTo(0, -185); g.lineTo(18, -150); g.fill(); g.fillStyle = 'rgba(240,210,140,.9)'; g.beginPath(); g.arc(0, -128, 7, 0, 7); g.fill();
  g.restore();
  ridge(9, 1700 + lift * .9, 160, '#080b13', t * 8);
  fogLayer(t, 40, .5, 2.0, 1050, 900); fogLayer(t, -25, .35, 1.4, 1200, 760);
  tint('#7f95c8', .35); vignette(.85);
}

/* one-point perspective street */
const VP = { x: 540, y: 880 };
function P(X, Y, Z, cam) { const f = 900 * cam.zoom, z = Z - cam.z; return [VP.x + cam.x + X / z * f, VP.y + cam.y + Y / z * f, z]; }
function quad(a, b, c, d, col) { g.fillStyle = col; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.lineTo(...d); g.closePath(); g.fill(); }
const fogMix = (z, base) => { const k = clamp((z - 2) / 18); return `rgb(${lerp(base[0] * .55, 40, k) | 0},${lerp(base[1] * .55, 48, k) | 0},${lerp(base[2] * .55, 66, k) | 0})`; };
const FAC = [];
for (const side of [-1, 1]) { let z = 1.2; let i = 0; while (z < 22) { const len = 2.2 + R() * 1.6, h = 3 + R() * 1.8; FAC.push({ side, z1: z, z2: z + len, h, col: [[96, 74, 58], [84, 70, 62], [104, 86, 66], [78, 66, 60]][i % 4], win: R(), door: R() < .7, lit: false }); z += len + .05; i++; } }
FAC.find(f => f.side === 1 && f.z1 > 5 && f.z1 < 9).curtain = true;
const LAMPS = [{ X: -3.7, Z: 4.5 }, { X: 3.7, Z: 9 }, { X: -3.7, Z: 14 }];
function sceneStreet(t, cam, opts = {}) {
  const sky = g.createLinearGradient(0, 0, 0, VP.y + cam.y); sky.addColorStop(0, '#070a14'); sky.addColorStop(1, '#2a3550'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  radial(700, 200 + cam.y, 380, 'rgba(160,180,220,.25)');
  // ground
  const gr = g.createLinearGradient(0, VP.y + cam.y, 0, H); gr.addColorStop(0, '#20263a'); gr.addColorStop(.25, '#151924'); gr.addColorStop(1, '#07080b'); g.fillStyle = gr; g.fillRect(0, VP.y + cam.y, W, H);
  // cobblestones
  g.strokeStyle = 'rgba(140,160,200,.16)'; g.lineWidth = 2;
  for (let Z = 1.05; Z < 22; Z *= 1.09) { const a = P(-4, 0, Z, cam), b = P(4, 0, Z, cam); if (a[2] <= .2) continue; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  for (let X = -4; X <= 4; X += .5) { const a = P(X, 0, Math.max(cam.z + .3, 1.05), cam), b = P(X, 0, 22, cam); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  // clock tower far away
  const tw = P(-.8, -14, 24, cam), tw2 = P(.8, 0, 24, cam);
  g.fillStyle = '#2a3046'; g.fillRect(tw[0], tw[1], tw2[0] - tw[0], tw2[1] - tw[1]);
  const sp = P(0, -16.5, 24, cam); g.beginPath(); g.moveTo(tw[0] - 6, tw[1]); g.lineTo(sp[0], sp[1]); g.lineTo(tw2[0] + 6, tw[1]); g.fill();
  const cc = P(0, -12, 23.9, cam), cr = (tw2[0] - tw[0]) * .36;
  radial(cc[0], cc[1], cr * 4, 'rgba(255,214,140,.35)');
  clockFace(cc[0], cc[1], cr, opts.time || [2, 58, 0], 'tower');
  // facades far to near
  const order = FAC.filter(f => f.z2 > cam.z + .4).sort((a, b) => b.z1 - a.z1);
  for (const f of order) {
    const X = f.side * 4, z1 = Math.max(f.z1, cam.z + .4);
    const a = P(X, 0, z1, cam), b = P(X, -f.h, z1, cam), c = P(X, -f.h, f.z2, cam), d = P(X, 0, f.z2, cam);
    quad(a, b, c, d, fogMix((z1 + f.z2) / 2 - cam.z, f.col));
    // roof edge
    const r1 = P(X - f.side * .5, -f.h - .25, z1, cam), r2 = P(X - f.side * .5, -f.h - .25, f.z2, cam); quad(b, r1, r2, c, fogMix((z1 + f.z2) / 2 - cam.z, [50, 34, 28]));
    // door
    if (f.door) { const dz = f.z1 + (f.z2 - f.z1) * .3, dz2 = dz + .9; if (dz > cam.z + .4) quad(P(X, 0, dz, cam), P(X, -2.1, dz, cam), P(X, -2.1, dz2, cam), P(X, 0, dz2, cam), fogMix(dz - cam.z, [44, 30, 22])); }
    // window
    const wz = f.z1 + (f.z2 - f.z1) * .68, wz2 = wz + .6;
    if (wz > cam.z + .4) {
      const curtainLit = f.curtain && opts.curtain;
      quad(P(X, -1.3, wz, cam), P(X, -2.3, wz, cam), P(X, -2.3, wz2, cam), P(X, -1.3, wz2, cam), curtainLit ? `rgba(255,190,110,${.55 + .2 * Math.sin(t * 3)})` : fogMix(wz - cam.z, [20, 18, 22]));
      if (curtainLit) { const k = clamp((t - opts.curtain) / 1.2); const cz = lerp(wz, wz2, .15 + .6 * Math.sin(k * Math.PI)); quad(P(X, -1.3, wz, cam), P(X, -2.3, wz, cam), P(X, -2.3, cz, cam), P(X, -1.3, cz, cam), 'rgba(60,40,30,.92)'); const m = P(X, -1.8, (wz + wz2) / 2, cam); radial(m[0], m[1], 90 / Math.max(.5, wz - cam.z) * 4, 'rgba(255,170,90,.3)'); }
    }
  }
  { const hz = g.createLinearGradient(0, VP.y + cam.y - 260, 0, VP.y + cam.y + 200); hz.addColorStop(0, 'rgba(60,72,98,0)'); hz.addColorStop(.6, 'rgba(60,72,98,.55)'); hz.addColorStop(1, 'rgba(60,72,98,0)'); g.fillStyle = hz; g.fillRect(0, VP.y + cam.y - 260, W, 460); }
  // lamps
  for (const L of LAMPS) {
    if (L.Z < cam.z + .5) continue;
    const base = P(L.X, 0, L.Z, cam), top = P(L.X, -3.4, L.Z, cam), arm = P(L.X - Math.sign(L.X) * .6, -3.4, L.Z, cam);
    g.strokeStyle = '#111'; g.lineWidth = Math.max(2, 14 / (L.Z - cam.z)); g.beginPath(); g.moveTo(...base.slice(0, 2)); g.lineTo(...top.slice(0, 2)); g.lineTo(...arm.slice(0, 2)); g.stroke();
    const fl = L === LAMPS[0] && opts.flicker ? (Math.sin(t * 40) > .2 || Math.sin(t * 7) > .6 ? 1 : .15) : flick(t, .4);
    const rr = 260 / (L.Z - cam.z) * 3;
    radial(arm[0], arm[1] + 8, rr, `rgba(255,196,110,${.55 * fl})`); g.fillStyle = `rgba(255,220,160,${fl})`; g.beginPath(); g.arc(arm[0], arm[1] + 6, Math.max(3, 28 / (L.Z - cam.z)), 0, 7); g.fill();
    const refl = P(L.X * .8, 0, L.Z - .6, cam); radial(refl[0], refl[1] + 30, rr * .8, `rgba(255,180,100,${.18 * fl})`);
  }
  fogLayer(t, 30, .38, 1.8, 500, 1300); fogLayer(t, -18, .25, 1.2, 900, 900);
  tint('#7d93c4', .3); vignette(.8);
}

function clockFace(cx, cy, r, [h, m, s], style) {
  g.save(); g.translate(cx, cy);
  if (style === 'wall') {
    g.fillStyle = '#3b2414'; g.beginPath(); g.arc(0, 0, r * 1.22, 0, 7); g.fill();
    g.strokeStyle = '#6b4526'; g.lineWidth = r * .06; g.beginPath(); g.arc(0, 0, r * 1.12, 0, 7); g.stroke();
    g.strokeStyle = '#b08a4a'; g.lineWidth = r * .03; g.beginPath(); g.arc(0, 0, r * 1.02, 0, 7); g.stroke();
  }
  const face = g.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r); face.addColorStop(0, style === 'tower' ? '#fff0c8' : '#efe3c6'); face.addColorStop(1, style === 'tower' ? '#d9b46a' : '#bfa77a');
  g.fillStyle = face; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  g.fillStyle = '#2a1c12'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (r > 60) {
    const RN = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
    g.font = `600 ${r * .17}px Cinzel, serif`;
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.fillText(RN[i], Math.sin(a) * r * .78, -Math.cos(a) * r * .78); }
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, l = i % 5 ? .04 : .08; g.lineWidth = i % 5 ? 2 : 4; g.strokeStyle = '#2a1c12'; g.beginPath(); g.moveTo(Math.sin(a) * r * .93, -Math.cos(a) * r * .93); g.lineTo(Math.sin(a) * r * (.93 - l), -Math.cos(a) * r * (.93 - l)); g.stroke(); }
  } else { for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.fillRect(Math.sin(a) * r * .8 - 1, -Math.cos(a) * r * .8 - 1, 3, 3); } }
  const hand = (a, len, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(-Math.sin(a) * len * .15, Math.cos(a) * len * .15); g.lineTo(Math.sin(a) * len, -Math.cos(a) * len); g.stroke(); };
  hand((h % 12 + m / 60) / 12 * Math.PI * 2, r * .5, Math.max(3, r * .07), '#1a120c');
  hand((m + s / 60) / 60 * Math.PI * 2, r * .78, Math.max(2, r * .045), '#1a120c');
  if (r > 60) hand(s / 60 * Math.PI * 2, r * .85, r * .015, '#8a1f1a');
  g.fillStyle = '#1a120c'; g.beginPath(); g.arc(0, 0, Math.max(3, r * .05), 0, 7); g.fill();
  g.restore();
}

function sceneWallClock(t, time, zoom, cand) {
  g.fillStyle = '#120c08'; g.fillRect(0, 0, W, H);
  // adobe wall texture
  g.save(); g.globalAlpha = .5; g.drawImage(CLOUD, 0, 0, W, H); g.restore();
  g.save(); g.translate(W / 2, H * .45); g.scale(zoom, zoom); g.translate(-W / 2, -H * .45);
  // pendulum case
  g.fillStyle = '#2c190c'; g.fillRect(W / 2 - 230, H * .45 - 40, 460, 900); g.fillStyle = '#1c0f07'; g.fillRect(W / 2 - 180, H * .45 + 330, 360, 480);
  const pa = Math.sin(t * Math.PI) * .18; g.save(); g.translate(W / 2, H * .45 + 300); g.rotate(pa); g.strokeStyle = '#a07a3a'; g.lineWidth = 8; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 400); g.stroke(); g.fillStyle = '#c49a4a'; g.beginPath(); g.arc(0, 420, 50, 0, 7); g.fill(); g.restore();
  clockFace(W / 2, H * .45, 250, time, 'wall');
  g.restore();
  radial(180, H * .7, 900, `rgba(255,150,60,${.45 * cand})`, 'screen');
  tint('#c08a5a', .25); vignette(.9, .15);
}

function sceneDoor(t, knockT) {
  let [sx, sy] = [0, 0]; for (const k of knockT) { const [a, b] = shake(t, k, 22); sx += a; sy += b; }
  g.fillStyle = '#0d0907'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(sx, sy);
  // wall
  g.fillStyle = '#3a2a1e'; g.fillRect(0, 0, W, H); g.save(); g.globalAlpha = .6; g.drawImage(CLOUD, -200, 0, 1500, H); g.restore();
  // frame
  g.fillStyle = '#24160c'; g.fillRect(170, 260, 740, 1500);
  // door planks
  for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#5a3a22' : '#61402a'; g.fillRect(210 + i * 110, 300, 108, 1440); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(210 + i * 110 + 104, 300, 4, 1440); }
  g.fillStyle = '#3a2414'; g.fillRect(210, 520, 660, 60); g.fillRect(210, 1360, 660, 60);
  g.fillStyle = '#1a1a1a'; for (const y of [550, 1390]) for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(250 + i * 118, y, 10, 0, 7); g.fill(); }
  g.fillStyle = '#222'; g.fillRect(780, 900, 40, 120); g.beginPath(); g.arc(800, 1040, 22, 0, 7); g.fill();
  // moonlight under the door + passing shadow
  const lineY = 1740; g.fillStyle = 'rgba(150,180,230,.9)'; g.fillRect(210, lineY, 660, 10);
  radial(540, lineY + 20, 420, 'rgba(120,150,210,.35)');
  const sh = clamp((t - knockT[0] + .6) / 2.5); if (sh > 0) { g.fillStyle = 'rgba(0,0,0,.9)'; g.fillRect(lerp(160, 470, ease(sh)), lineY - 2, 150, 14); g.fillRect(lerp(160, 470, ease(sh)) + 190, lineY - 2, 120, 14); }
  // dust falling after knocks
  for (const k of knockT) { const dt = t - k; if (dt < 0 || dt > 2.5) continue; const r = rng(Math.floor(k * 100)); for (let i = 0; i < 26; i++) { const x = 220 + r() * 640, y = 280 + dt * dt * 260 * (.5 + r()) + r() * 40; g.fillStyle = `rgba(220,200,170,${.6 * (1 - dt / 2.5)})`; g.fillRect(x, y, 3, 3); } }
  g.restore();
  radial(60, H * .55, 1000, `rgba(255,150,60,${.5 * flick(t, .7)})`, 'screen');
  tint('#9a7a6a', .25); vignette(.9, .12);
}

/* ---------- photo scenes ---------- */
function sceneTruck(t, k, variant) {
  const img = IMG.camioneta; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (variant === 'arrive') photo(img, lerp(420, 560, ease(k)), 470, lerp(2.4, 2.65, k));
  else photo(img, lerp(980, 1080, ease(k)), lerp(330, 360, k), lerp(2.9, 3.2, k));
  // taillights
  const tl = .8 + .2 * Math.sin(t * 3);
  if (variant === 'arrive') { const s = lerp(2.4, 2.65, k), cx = lerp(420, 560, ease(k)); for (const [x, y] of [[142, 566], [416, 572]]) radial(W / 2 + (x - cx) * s, H / 2 + (y - 470) * s, 120, `rgba(255,40,30,${.5 * tl})`); }
  // streetlight flicker overlay
  const s2 = variant === 'arrive' ? lerp(2.4, 2.65, k) : lerp(2.9, 3.2, k), cx2 = variant === 'arrive' ? lerp(420, 560, ease(k)) : lerp(980, 1080, ease(k)), cy2 = variant === 'arrive' ? 470 : lerp(330, 360, k);
  const lx = W / 2 + (1018 - cx2) * s2, ly = H / 2 + (210 - cy2) * s2;
  const fl = variant === 'flicker' ? (Math.sin(t * 37) > -.1 || Math.sin(t * 5.3) > .7 ? 1 : 0) : 1;
  if (!fl) { tint('#000', .45, 'source-over'); } else radial(lx, ly, 420, 'rgba(255,200,120,.25)');
  fogLayer(t, 45, .45, 1.6, 0, H); fogLayer(t, -20, .3, 1.1, 900, 1020);
  tint('#7f97c4', .28); vignette(.8);
}
function windshield(t) {
  // car interior: A-pillar, dashboard, glass reflections
  g.fillStyle = '#05060a'; g.beginPath(); g.moveTo(0, 0); g.lineTo(150, 0); g.lineTo(0, 700); g.fill();
  g.beginPath(); g.moveTo(W, 0); g.lineTo(W - 120, 0); g.lineTo(W, 520); g.fill();
  const d = g.createLinearGradient(0, H - 330, 0, H); d.addColorStop(0, 'rgba(5,6,10,0)'); d.addColorStop(.35, 'rgba(5,6,10,.95)'); d.addColorStop(1, '#030305'); g.fillStyle = d; g.fillRect(0, H - 330, W, 330);
  radial(W * .5, H - 120, 520, 'rgba(90,170,190,.25)', 'screen');
  // passing light streaks on glass
  const p = (t * .35) % 1; g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = .18 * Math.sin(p * Math.PI); g.translate(lerp(-600, W + 600, p), 0); g.rotate(-.35); g.fillStyle = '#ffd9a0'; g.fillRect(-60, -400, 120, H + 800); g.restore();
}
function sceneDaniel(t, k, mode) {
  const img = IMG.daniel; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (mode === 'drive') photo(img, lerp(500, 490, k), lerp(330, 300, k), lerp(2.95, 3.25, k));
  else if (mode === 'phone') photo(img, lerp(470, 465, k), lerp(240, 225, k), lerp(4.4, 5.0, k));
  else if (mode === 'eyes') photo(img, 465, 214, lerp(6.4, 7.2, k));
  else if (mode === 'react') photo(img, 470, lerp(250, 235, k), lerp(4.6, 5.0, k));
  // night grade: crush studio background, cold key, warm or phone fill
  tint('#4a5f8a', .55);
  const gr = g.createRadialGradient(W / 2, H * .42, H * .18, W / 2, H * .42, H * .62); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(2,4,10,.92)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (mode === 'drive') { radial(W * .5, H * 1.05, 900, 'rgba(255,170,90,.22)'); windshield(t); }
  if (mode === 'phone') {
    const buzz = t % 3 < .9 && t < 40.5 ? Math.sin(t * 120) * 4 : 0;
    radial(W * .78, H * .9, 1000, 'rgba(150,190,255,.32)');
    g.save(); g.translate(W * .8 + buzz, H * .93); g.rotate(-.25); g.fillStyle = '#0b0b0f'; g.beginPath(); g.roundRect(-150, -300, 300, 600, 36); g.fill();
    const sc = g.createLinearGradient(0, -280, 0, 280); sc.addColorStop(0, '#6f8fc4'); sc.addColorStop(1, '#2f4f88'); g.fillStyle = sc; g.beginPath(); g.roundRect(-132, -280, 264, 560, 26); g.fill(); g.restore();
  }
  if (mode === 'eyes' || mode === 'react') radial(0, H * .5, 1100, `rgba(255,150,70,${.35 * flick(t, .6)})`);
  fogLayer(t, 15, .12, 1.4);
  vignette(.85, .2);
}
function sceneAbuela(t, k, mode, tearT) {
  const img = IMG.abuela; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  let cx, cy, s;
  if (mode === 'door') { cx = 540; cy = lerp(560, 520, k); s = lerp(1.95, 2.25, k); }
  else if (mode === 'close') { cx = 545; cy = lerp(560, 590, k); s = lerp(2.9, 3.25, k); }
  else { cx = 540; cy = 500; s = lerp(4.2, 4.7, k); }
  photo(img, cx, cy, s);
  tint('#6a5a52', .5);
  const gr = g.createRadialGradient(W / 2, H * .45, H * .2, W / 2, H * .45, H * .6); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(6,3,2,.93)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  radial(W * .1, H * .55, 1100, `rgba(255,150,60,${.5 * flick(t)})`);
  if (mode === 'door') { const c = g.createLinearGradient(W * .6, 0, W, 0); c.addColorStop(0, 'rgba(60,90,150,0)'); c.addColorStop(1, 'rgba(60,90,150,.35)'); g.save(); g.globalCompositeOperation = 'screen'; g.fillStyle = c; g.fillRect(0, 0, W, H); g.restore(); }
  // tear sliding from her left eye (image right eye ~ 650,480)
  if (tearT != null && t > tearT) {
    const d = clamp((t - tearT) / 4.5), ty = 498 + ease(d) * 170, tx = 648 - d * 10;
    const X = W / 2 + (tx - cx) * s, Y = H / 2 + (ty - cy) * s, rr = 5.5 * s;
    g.save(); g.globalCompositeOperation = 'screen'; g.strokeStyle = 'rgba(220,230,255,.25)'; g.lineWidth = rr * .9; g.beginPath(); g.moveTo(W / 2 + (650 - cx) * s, H / 2 + (496 - cy) * s); g.lineTo(X, Y - rr); g.stroke();
    const tg = g.createRadialGradient(X - rr * .3, Y - rr * .3, 0, X, Y, rr * 1.3); tg.addColorStop(0, 'rgba(255,255,255,.95)'); tg.addColorStop(.5, 'rgba(200,220,255,.45)'); tg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = tg; g.beginPath(); g.arc(X, Y, rr * 1.3, 0, 7); g.fill(); g.restore();
  }
  fogLayer(t, 10, .08, 1.4);
  vignette(.85, .2);
}

/* ---------- end card ---------- */
function endCard(t, k) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = clamp(k * 1.5) * .32; photo(IMG.figura, 300, 330, 3.3 + k * .3); g.restore();
  tint('#5f78b0', .5); fogLayer(t, 30, .5, 1.6); vignette(.95, .1);
  const a1 = clamp(k * 3), a2 = clamp(k * 3 - .6), a3 = clamp(k * 3 - 1.2), a4 = clamp(k * 3 - 1.8);
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 24;
  g.fillStyle = `rgba(236,228,214,${a1})`; g.font = '800 104px Cinzel, serif'; g.fillText('EL PUEBLO', W / 2, 700); g.fillText('QUE NO DUERME', W / 2, 820);
  g.fillStyle = `rgba(190,40,40,${a1})`; g.fillRect(W / 2 - 120, 900, 240, 4);
  g.fillStyle = `rgba(236,228,214,${a2})`; g.font = '600 46px Cinzel, serif'; if ('letterSpacing' in g) g.letterSpacing = '10px'; g.fillText('EPISODIO 01', W / 2, 990); g.fillText('LA LLEGADA', W / 2, 1060);
  g.fillStyle = `rgba(236,228,214,${a3})`; g.font = '600 56px Cinzel, serif'; g.fillText('CONTINUARÁ...', W / 2, 1250);
  if ('letterSpacing' in g) g.letterSpacing = '3px';
  g.fillStyle = `rgba(255,255,255,${a4})`; g.font = '800 40px Inter, sans-serif'; g.fillText('SUSCRÍBETE PARA VER LA PARTE 2', W / 2, 1520);
  g.restore();
}

/* ---------- subtitles (phrase groups) ---------- */
let GROUPS = null;
function buildGroups() {
  GROUPS = [];
  for (const v of TL.voices) { if (!v.words.length) continue; let cur = [];
    v.words.forEach((w, i) => { cur.push(w); const end = /[.,…:?!]$/.test(w[2]) || cur.length >= 4 || i === v.words.length - 1; if (end) { GROUPS.push({ a: cur[0][0], b: (v.words[i + 1] ? v.words[i + 1][0] : cur[cur.length - 1][1] + .3), txt: cur.map(x => x[2]).join(' '), who: v.who }); cur = []; } }); }
}
function subtitle(t) {
  if (!GROUPS) buildGroups();
  const gp = GROUPS.find(x => t >= x.a && t < x.b); if (!gp) return;
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = gp.who === 'nar' ? '800 62px Inter, sans-serif' : 'italic 800 62px Inter, sans-serif';
  const txt = gp.txt.replace(/\.\.\.$/, '…');
  g.lineJoin = 'round'; g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,.9)'; g.strokeText(txt, W / 2, 1460);
  g.fillStyle = gp.who === 'abu' ? '#ffd9a8' : gp.who === 'sus' ? '#ff8a80' : '#fff'; g.fillText(txt, W / 2, 1460); g.restore();
}

/* ---------- main ---------- */
function render(t, subs) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const C = TL.clips, ev = TL.ev;
  const ci = C.findIndex(c => t >= c.start && t < c.end);
  const c = ci >= 0 ? C[ci] : null, lt = c ? t - c.start : 0, k = c ? lt / (c.end - c.start) : 0;
  if (t >= ev.card) endCard(t, (t - ev.card) / (TL.total - ev.card));
  else switch (ci) {
    case 0: sceneAerial(t, k); break;
    case 1: { const secs = lerp(30, 59.6, k); sceneStreet(t, { x: 0, y: lerp(60, 380, ease(k)), z: lerp(0, 9, ease(k)), zoom: lerp(1, 1.35, ease(k)) }, { time: [2, 59, secs], curtain: c.start + 5.6 }); break; }
    case 2: sceneTruck(t, k, 'arrive'); break;
    case 3: sceneDaniel(t, k, 'drive'); break;
    case 4: sceneDaniel(t, k, 'phone'); break;
    case 5: if (lt < 5) sceneTruck(t, lt / 5, 'flicker'); else { const kk = (lt - 5) / 6; sceneStreet(t, { x: lerp(160, -160, ease(kk)), y: -120, z: lerp(1, 3, kk), zoom: 1.05 }, { time: [3, 12, 0], flicker: true }); } break;
    case 6: if (lt < 2.2) sceneDoor(t, []); else sceneAbuela(t, (lt - 2.2) / 4.3, 'door', c.start + 3.2); break;
    case 7: { if (lt < 3.6) sceneAbuela(t, lt / 3.6, 'close', c.start - 1); else if (lt < 6.2) sceneWallClock(t, [3, 32, 20 + lt * 1.0], lerp(1, 1.12, (lt - 3.6) / 2.6), flick(t)); else if (lt < 8) sceneAbuela(t, (lt - 6.2) / 1.8, 'eyes', null); else sceneDaniel(t, (lt - 8) / 1.5, 'react'); break; }
    case 8: {
      const kn = ev.knocks;
      if (t < ev.flip + 1.6) { const before = t < ev.flip; const s = before ? 56 + (t - (ev.flip - 4)) : (t - ev.flip); sceneWallClock(t, [3, before ? 32 : 33, Math.max(0, Math.min(59.9, s))], lerp(1.35, 1.6, clamp((t - c.start) / 4)), flick(t)); if (!before) { const [a] = shake(t, ev.flip, 10); } }
      else if (t < kn[2] + 1.0) sceneDoor(t, kn);
      else if (t < ev.fade - 1.4) sceneDaniel(t, (t - kn[2] - 1) / 3, 'eyes');
      else sceneAbuela(t, (t - (ev.fade - 1.4)) / 2.4, 'close', ev.fade - 2.6);

  g.save(); g.globalCompositeOperation = 'overlay'; const ox = Math.random() * 256, oy = Math.random() * 256; for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) g.drawImage(GRAIN, x, y); g.restore();
  let d = 9; for (const cc of C) d = Math.min(d, Math.abs(t - cc.start)); d = Math.min(d, t);
  const fa = 1 - clamp(d / .3); if (fa > 0 && t < ev.card) tint('#000', fa * (ci === 0 && t < 1 ? 1 : .85), 'source-over');
  if (t < 1.2) tint('#000', 1 - t / 1.2, 'source-over');
  if (subs && t < ev.card) subtitle(t);
}
window.render = render;
</script>
